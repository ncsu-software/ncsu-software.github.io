{% comment %} Pick Your Professor: topic matrix + detail card.
   Data: _data/topics.yml. NB: theme minifies HTML to one line, so no // comments in the script. {% endcomment %}
<table id="pick-matrix" class="pick-matrix"></table>
<div class="pick-legend">
  <span><b class="l1" aria-hidden="true">&middot;</b> some</span><span><b class="l2" aria-hidden="true">+</b> active</span><span><b class="l3" aria-hidden="true">&#9679;</b> core</span>
  <span>Rows sorted by total interest.</span>
</div>
<div id="pick-card"><span class="muted">Click a name to see their lab, focus, and core topics.</span></div>

<script>
document.addEventListener("DOMContentLoaded", function () {
  var D = {{ site.data.topics | jsonify }};
  var P = D.profs, IMG = "{{ '/img/' | relative_url }}";
  var card = document.getElementById("pick-card");
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); };
  var fr = null, fc = null, m = document.getElementById("pick-matrix");
  function show(j) {
    var p = P[j], kind = {n: "neural AI", s: "symbolic AI", ns: "neural and symbolic AI"}[p.ai];
    card.innerHTML = '<img class="headshot" src="' + IMG + esc(p.img) + '" alt="' + esc(p.name) + '"><div class="nm">' + esc(p.name) + '</div><div class="muted">' + esc(p.lab) + ' · ' + esc(p.zone) +
      (kind ? ' · ' + kind : '') + '</div><p>' + esc(p.text) + '</p><div>' +
      p.tags.map(function (t) { return '<span class="chip">' + esc(t) + '</span>'; }).join('') +
      '</div><p><a href="' + esc(p.url) + '">Visit the lab site</a></p>';
  }
  var sum = function (v) { return v.reduce(function (a, b) { return a + b; }, 0); };
  var T = D.topics.slice().sort(function (a, b) { return sum(b.s) - sum(a.s); });
  var LEVEL = ["none", "some", "active", "core"];
  var GLYPH = ["", "&middot;", "+", "&#9679;"];
  /* topic labels sit on the RIGHT of the grid, so the header row ends with
     the corner cell rather than starting with it */
  var h = '<thead><tr>' + P.map(function (p, j) {
    return '<th class="p" data-j="' + j + '" tabindex="0" role="button" aria-pressed="false"><span>' + esc(p.name) + '</span></th>'; }).join('') +
    '<th><span class="sr-only">Topic</span></th></tr></thead><tbody>';
  T.forEach(function (r, i) {
    h += '<tr data-i="' + i + '">' +
      r.s.map(function (x, j) { var lab = esc(P[j].name) + ': ' + LEVEL[x];
        return '<td class="c' + (x ? ' l' + x : '') + '" data-j="' + j + '" title="' + lab + '" aria-label="' + lab +
          '"><span aria-hidden="true">' + GLYPH[x] + '</span></td>'; }).join('') +
      '<td class="t" tabindex="0" role="button" aria-pressed="false">' + esc(r.t) + '</td></tr>';
  });
  m.innerHTML = h + '</tbody>';
  function draw() {
    m.querySelectorAll("tr[data-i]").forEach(function (r) {
      var i = +r.dataset.i;
      r.classList.toggle("dim", fc !== null ? T[i].s[fc] === 0 : (fr !== null && i !== fr));
      var t = r.querySelector(".t");
      t.classList.toggle("on", i === fr);
      t.setAttribute("aria-pressed", i === fr ? "true" : "false");
    });
    m.querySelectorAll("td.c").forEach(function (c) {
      var j = +c.dataset.j;
      c.classList.toggle("dim", (fr !== null && T[fr].s[j] === 0) || (fc !== null && j !== fc));
    });
    m.querySelectorAll("th.p").forEach(function (t) {
      var j = +t.dataset.j; t.classList.toggle("on", j === fc || (fr !== null && T[fr].s[j] === 3));
      t.setAttribute("aria-pressed", j === fc ? "true" : "false");
    });
  }
  function hit(target) {
    var t = target.closest("td.t"), p = target.closest("th.p");
    if (t) { var i = +t.parentNode.dataset.i; fr = (fr === i ? null : i); fc = null; draw(); return true; }
    if (p) { var j = +p.dataset.j; fc = (fc === j ? null : j); fr = null; show(j); draw(); return true; }
    return false;
  }
  m.addEventListener("click", function (e) { hit(e.target); });
  /* 2.1.1: the row and column heads are role=button, so Enter and Space must work too */
  m.addEventListener("keydown", function (e) {
    if (e.key !== "Enter" && e.key !== " " && e.key !== "Spacebar") { return; }
    if (hit(e.target)) { e.preventDefault(); }
  });
});</script>
