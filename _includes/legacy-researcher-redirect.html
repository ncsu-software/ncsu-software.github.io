{% comment %}Old per-researcher pages (?email=...) now forward to that person's own website.{% endcomment %}
<section class="page-hero">
  <div class="container">
    <h1>{{ page.title }}</h1>
    <p class="page-hero-lead">This page has moved. <a href="{{ '/people/' | relative_url }}">See our people</a>.</p>
  </div>
</section>
<script>
  (function () {
    var sites = { {% for person in site.data.faculty %}{% for email in person.emails %}"{{ email }}": "{{ person.website }}",{% endfor %}{% endfor %} };
    var email = new URLSearchParams(window.location.search).get("email");
    window.location.replace(sites[email] || "{{ '/people/' | relative_url }}");
  })();
</script>
