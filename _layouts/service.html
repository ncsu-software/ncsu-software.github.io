---
layout: default
bodyClass: "page-service"
---

<section class="page-hero">
  <div class="container">
    {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
    <h1>{{ page.heading | default: page.title }}</h1>
    {% if page.lead %}<p class="page-hero-lead">{{ page.lead }}</p>{% endif %}
  </div>
</section>

{{ content }}
