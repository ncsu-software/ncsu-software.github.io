      how AI, team communication, and coordination affect the products
      we build. Her research looks at how software product managers and
      software engineers work together, where alignment succeeds and
      where it creates friction. Also builds educational opportunities
      for future PMs and engineers. Off hours: local coffee and food
      spots, and anything outside.

