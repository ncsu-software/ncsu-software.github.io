  # Entries below came from the Student Life lab grids. Photo, lab and (where
  # known) home page are real; the bio is pending until the student fills in
  # their Drive doc. Replace `pending: true` and the bio when they do.
  - name: "Amirali Rayegan"
    slug: amirali-rayegan
    email: arayega@ncsu.edu
    lab: irl
    url: https://amiiralii.github.io/
    bio: >-
      Third-year PhD student working on label-efficient software
      optimization. His aim is to come at optimization from several
      directions at once — explainability, stability, performance — so
      that the tools are practical enough for practitioners to adopt.
      Hence Minimal Data, Maximum Clarity (JSS 2026) arrives alongside a
      causal investigation paper (SANER 2026) and an instability paper
      (TSE).

  - name: "Kishan Kumar Ganguly"
    slug: kishan-kumar-ganguly
    email: kgangul@ncsu.edu
    lab: irl
    url: https://kkganguly.github.io/
    bio: >-
      PhD student from Bangladesh. His research asks how to make reliable
      decisions about complex software and AI systems when data, time and
      compute are all short: data-efficient optimization, software
      testing, and cheap evaluation of LLM-based systems. Recent work
      includes How Low Can You Go? (FSE 2026), Zoom, Don't Wander
      (SSBSE 2026) and From Coverage to Causes (IST 2026). The recurring
      theme is asking how much experimentation is actually needed to
      reach a trustworthy conclusion. Outside research: video games and
      travel, preferably without turning either into another optimization
      problem.

  - name: "Srinath Srinivasan"
    slug: srinath-srinivasan
    email: ssrini27@ncsu.edu
    lab: irl
    url: https://srina1h.github.io/
    bio: >-
      Studies when, where and how LLMs help with software engineering
      tasks such as optimization and the oracle problem. The focus is
      efficiency: placing LLMs surgically, where they deliver the most
      value, to build SE systems that scale and stay practical to run.

