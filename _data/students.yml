  - name: "Tiva Rocco"
    slug: tiva-rocco
    email: tprocco@ncsu.edu
    lab: sset
    url: https://tiva710.github.io/
    bio: >-
      Works in CS/SE education: equitable assessment of individual
      contributions, and educational data mining. BS in CS from
      CSU Monterey Bay; originally from Hollister, California. Enjoys
      good food with good people, nice views, and long walks.

  - name: "M M Abid Naziri"
    slug: abid-naziri
    email: mnaziri@ncsu.edu
    lab: swat
    url: https://abidnazirisami.github.io/
    bio: >-
      Finds bugs in complex software: systems whose inputs must meet
      intricate constraints or whose correct behavior is hard to
      specify. Builds techniques that generate test inputs and oracles
      for foundational software such as deep-learning libraries,
      compilers, and LLM-serving engines, where one bug can reach
      thousands of downstream apps. From Bangladesh. Off hours: video
      games, friends, and the occasional bit of music.

  - name: "Hua Yang"
    slug: hua-yang
    email: hyang45@ncsu.edu
    lab: softmax
    url: https://huayangttt.github.io/
    bio: >-
      Third-year PhD student from Chengdu, China. Works on trustworthy
      AI, large language models, and software engineering, with a
      focus on AI privacy and security. Previously interned at
      ByteDance. Off hours: travelling and meeting new cultures,
      working out, tennis, and trying different foods.

  - name: "Sen Fang"
    slug: sen-fang
    email: sfang9@ncsu.edu
    lab: softmax
    url: https://tomasandersonfang.github.io/
    bio: >-
      PhD student who started at NC State in 2024. Works on LLMs for
      code and security: LLM agents that find software vulnerabilities
      (AEGIS), and benchmarks for that area (VEXED, CodeQL-Bench). Has
      also studied how robust code LLMs really are (EvaLooop,
      quantized LLMs). Outside the lab he cooks, looks at the stars,
      and has played Dota 2 for about 20 years (Invoker main).

  - name: "Xiang Lan"
    slug: xiang-lan
    email: xlan4@ncsu.edu
    lab: softmax
    url: https://www.linkedin.com/in/xiang-lan-0aba58173/
    bio: >-
      Third-year PhD student working on trustworthy AI for code and
      efficient ML systems. Research focus: the security of code LLMs,
      especially backdoor attacks and vulnerability detection.
      Previously interned at Google on ML performance debugging. Off
      hours: hiking and fishing.

  - name: "Kevin Lira"
    slug: kevin-lira
    nophoto: true
    email: kwlira@ncsu.edu
    lab: evolve
    url: https://kevinws.com/
    bio: >-
      Second-year PhD student from Maceio, Brazil. Researches how LLMs
      can better detect and repair software vulnerabilities, and builds
