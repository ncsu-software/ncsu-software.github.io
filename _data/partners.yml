# Industry partners, rendered as a grid by partners.md.
#
# name:  the short label (also the text of the fallback badge)
# full:  expansion, shown as the cell's tooltip and as the logo's alt text
# logo:  path under /img/partners/. Blank falls back to the badge, so the
#        page is complete either way -- ITPRO, LAS, SEI and Tecgraf have no
#        published mark we could source, and keep their badge.
#        The rest came from each company's current logo as recorded on
#        Wikidata (property P154, preferred rank = the mark in use today).
#        These are the companies' trademarks, used here to say who we work
#        with; several of them (NASA, Meta, Google, Microsoft) restrict logo
#        use that implies endorsement, so swap in whatever a company sends
#        us if they ask.
