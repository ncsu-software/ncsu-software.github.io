title: NC State Software Engineering (NCSU SE)
url: https://ncsu.software
baseurl: ""
remote_theme: just-the-docs/just-the-docs@v0.8.2
plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-sitemap
  # accessibility.html became compliance.html; this keeps the old URL alive
  - jekyll-redirect-from
search_enabled: true
mermaid:
  version: "9.4.3"
color_scheme: wolfpack
# jekyll-seo-tag publishes this as the organization's logo in JSON-LD, so it
# has to be the brick, not a mark of our own (brand.ncsu.edu/brand-architecture).
# Nothing renders it: _includes/title.html is overridden to emit the brick.
logo: "/img/ncstate-brick-4x1-red.png"
exclude:
  - vendor
  - intray
  - tools          # a11y scanner: its node_modules READMEs are not site pages
  - node_modules
  - TODO.md
  - page.md
  - Makefile
